name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish build diagnostics
        if: always()
        shell: pwsh
        run: |
          "## Build diagnostics" >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          Get-Content build.log -Tail 100 >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duoduo-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: duoduo-windows-build-log
          path: build.log
          if-no-files-found: error
